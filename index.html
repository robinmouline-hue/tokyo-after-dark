<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050615"><title>Ambiances — Tokyo & Starscape</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050615;color:white;font-family:Arial,Helvetica,sans-serif} .screen{position:fixed;inset:0;display:none;overflow:hidden}.screen.active{display:block}#tokyoFrame{width:100%;height:100%;border:0;display:block}.galaxy-bg{position:absolute;inset:-2%;background:url('starscape.png') center bottom/cover no-repeat;animation:none}.galaxy-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 58% 45%,rgba(125,180,210,.018),transparent 55%);animation:glow 10s ease-in-out infinite alternate;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hud{position:absolute;right:4.5%;top:4.5%;text-align:right;text-shadow:0 2px 20px #000;font-weight:300;opacity:.85;pointer-events:none}.time{font-size:clamp(27px,3.3vw,65px);letter-spacing:.04em}.date{font-size:clamp(11px,1.1vw,19px);margin-top:4px}.weather{margin-top:14px;font-size:clamp(14px,1.4vw,23px)}.weather small{display:block;font-size:clamp(10px,.8vw,14px);margin-top:5px}.menu-button{position:fixed;z-index:50;left:2.6%;top:3%;background:rgba(7,9,28,.48);border:1px solid rgba(255,255,255,.23);border-radius:12px;color:white;padding:10px 15px;font-size:15px;cursor:pointer;opacity:.13;transition:opacity .2s}.menu-button:focus,.menu-button:hover,.menu-button.open{opacity:1}.menu{position:fixed;z-index:60;left:2.6%;top:9%;width:min(320px,88vw);padding:17px;border-radius:18px;background:rgba(7,9,27,.91);border:1px solid rgba(255,255,255,.28);box-shadow:0 12px 45px #000b;display:none}.menu.show{display:block}.menu-title{font-size:14px;letter-spacing:.1em;color:#d3d7f4;margin-bottom:14px}.choice{display:block;width:100%;padding:15px 14px;margin-top:8px;text-align:left;color:white;background:#ffffff0d;border:1px solid #ffffff30;border-radius:11px;font-size:17px;cursor:pointer}.choice.selected{border-color:#b8a5ff;background:#7e56e233}.choice:focus{outline:3px solid #bba7ff;outline-offset:2px}.sub{display:block;margin-top:5px;color:#c5c6dc;font-size:12px}.menu-tip{margin-top:14px;color:#c0c0d3;font-size:12px;line-height:1.5}.hint{position:fixed;left:3%;bottom:3%;z-index:10;font-size:12px;opacity:.4;text-shadow:0 2px 10px #000;pointer-events:none}body.menu-open .hint{opacity:0}@keyframes drift{from{transform:scale(1.015) translate(-.15%,.15%)}to{transform:scale(1.075) translate(.5%,-.25%)}}@keyframes glow{from{opacity:.25}to{opacity:.65}}@media(prefers-reduced-motion:reduce){.galaxy-bg,.galaxy-glow{animation:none}}
</style></head><body>
<div class="screen" id="tokyo"><iframe id="tokyoFrame" title="Tokyo After Dark" src="tokyo.html" loading="eager"></iframe></div>
<div class="screen" id="galaxy"><div class="galaxy-bg"></div><div class="galaxy-glow"></div><canvas id="stars"></canvas><div class="hud"><div class="time" id="time"></div><div class="date" id="date"></div><div class="weather" id="weather">Nancy · Météo en chargement…</div></div></div>
<button class="menu-button" id="menuButton" aria-label="Choisir une ambiance">☰ Ambiances</button><div class="menu" id="menu" role="dialog" aria-label="Choisir une ambiance"><div class="menu-title">CHOISIR UNE AMBIANCE</div><button class="choice" data-scene="tokyo">🌧 Tokyo After Dark<span class="sub">Pluie, circulation, néons</span></button><button class="choice" data-scene="galaxy">✦ Starscape Timelapse<span class="sub">Voie lactée, étoiles filantes</span></button><div class="menu-tip">Télécommande : OK pour ouvrir · ↑ ↓ pour choisir · OK pour valider · Retour pour fermer</div></div><div class="hint">OK : changer d’ambiance</div>
<script>(function(){'use strict';var current='tokyo',menuOpen=false,menu=document.getElementById('menu'),menuButton=document.getElementById('menuButton'),choices=[].slice.call(document.querySelectorAll('.choice'));try{var saved=localStorage.getItem('ambiance-choice');if(saved==='galaxy')current=saved}catch(e){}function setScene(name){current=name;document.getElementById('tokyo').classList.toggle('active',name==='tokyo');document.getElementById('galaxy').classList.toggle('active',name==='galaxy');choices.forEach(function(b){b.classList.toggle('selected',b.getAttribute('data-scene')===name)});try{localStorage.setItem('ambiance-choice',name)}catch(e){}closeMenu()}function openMenu(){menuOpen=true;menu.classList.add('show');menuButton.classList.add('open');document.body.classList.add('menu-open');choices[current==='galaxy'?1:0].focus()}function closeMenu(){menuOpen=false;menu.classList.remove('show');menuButton.classList.remove('open');document.body.classList.remove('menu-open');menuButton.blur()}function toggleMenu(){menuOpen?closeMenu():openMenu()}menuButton.addEventListener('click',toggleMenu);choices.forEach(function(b){b.addEventListener('click',function(){setScene(b.getAttribute('data-scene'))})});function keys(e){var k=e.key;if(menuOpen){if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();e.stopImmediatePropagation();var i=choices.indexOf(document.activeElement);choices[(i+(k==='ArrowDown'?1:choices.length-1))%choices.length].focus()}else if(k==='Escape'||k==='Backspace'){e.preventDefault();e.stopImmediatePropagation();closeMenu()}else if(k==='Enter'||k===' '){if(document.activeElement===choices[0]||document.activeElement===choices[1]){e.preventDefault();e.stopImmediatePropagation();setScene(document.activeElement.getAttribute('data-scene'))}}}else if(k==='Enter'||k===' '){e.preventDefault();e.stopImmediatePropagation();openMenu()}}document.addEventListener('keydown',keys,true);var f=document.getElementById('tokyoFrame');f.addEventListener('load',function(){try{f.contentWindow.addEventListener('keydown',keys,true)}catch(e){}});setScene(current);
var canvas=document.getElementById('stars'),ctx=canvas.getContext('2d'),W=0,H=0,stars=[],meteors=[],last=0,nextMeteor=performance.now()+18000,prev=0;
function rand(a,b){return a+Math.random()*(b-a)}
function resize(){W=window.innerWidth;H=window.innerHeight;var dpr=Math.min(1.35,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=[];for(var i=0;i<115;i++)stars.push({x:rand(.03,.97),y:rand(.03,.74),r:rand(.45,1.45),p:rand(0,6.28),speed:rand(.00035,.0015),base:rand(.06,.35),bright:i<13});}
function draw(t){requestAnimationFrame(draw);if(current!=='galaxy')return;if(t-last<33)return;var dt=Math.min((t-(prev||t))/16.7,2);prev=t;last=t;ctx.clearRect(0,0,W,H);
// Time-lapse: the faint star layer drifts slowly across the sky, never over the trees.
var drift=(t/1000)*.11;
for(var i=0;i<stars.length;i++){var s=stars[i],x=(s.x*W+drift)%(W+20),y=s.y*H;if(y>H*.755)continue;var pulse=.5+.5*Math.sin(t*s.speed+s.p),alpha=s.base+(s.bright?.58:.23)*pulse;ctx.fillStyle='rgba(225,241,255,'+alpha+')';ctx.beginPath();ctx.arc(x,y,s.bright?s.r*1.55:s.r,0,Math.PI*2);ctx.fill();if(s.bright){ctx.strokeStyle='rgba(205,229,255,'+(alpha*.34)+')';ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.stroke()}}
if(t>nextMeteor){nextMeteor=t+rand(30000,60000);var x=rand(W*.18,W*.83),y=rand(H*.05,H*.44);meteors.push({x:x,y:y,vx:rand(-6.5,-3.8),vy:rand(1.5,2.8),life:0,max:rand(30,48)})}
for(i=meteors.length-1;i>=0;i--){var m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.life+=dt;var alpha=Math.max(0,Math.sin(Math.PI*m.life/m.max))*.9;if(m.y<H*.77){var grad=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*13,m.y-m.vy*13);grad.addColorStop(0,'rgba(255,255,255,'+alpha+')');grad.addColorStop(1,'rgba(165,204,242,0)');ctx.strokeStyle=grad;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*13,m.y-m.vy*13);ctx.stroke()}if(m.life>=m.max||m.y>H*.77)meteors.splice(i,1)}}
function clock(){var d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}function weather(){var w=document.getElementById('weather');fetch('https://api.open-meteo.com/v1/forecast?latitude=48.6921&longitude=6.1844&current=temperature_2m,weather_code&timezone=Europe%2FParis',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(j){var c=j.current||{},code=c.weather_code;var desc=code===0?'Ciel dégagé':code<=3?'Nuageux':code<=48?'Brume':code<=67?'Pluie':code<=77?'Neige':code<=82?'Averses':code<=86?'Neige':code>=95?'Orage':'Variable';w.innerHTML='Nancy · '+Math.round(c.temperature_2m)+'°C<small>'+desc+'</small>'}).catch(function(){w.textContent='Nancy · Météo indisponible'})}window.addEventListener('resize',resize);resize();clock();weather();setInterval(clock,15000);setInterval(weather,1200000);requestAnimationFrame(draw)})();</script></body></html>
