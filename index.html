<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c1b"><title>Tokyo After Dark 3.4 — Circulation nocturne</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c1b;color:#fff;font-family:Arial,sans-serif}.scene{position:fixed;inset:0;overflow:hidden}.backdrop{position:absolute;inset:0;background:url('tokyo-cinematic.jpg') center/cover no-repeat;transform:scale(1.012)}.layer{position:absolute;inset:0;pointer-events:none}.mist{background:radial-gradient(ellipse 32% 20% at 57% 47%,rgba(180,195,236,.26),transparent 75%),radial-gradient(ellipse 29% 16% at 80% 38%,rgba(192,178,222,.21),transparent 75%);filter:blur(21px);animation:mist 35s ease-in-out infinite alternate}.reflections{background:radial-gradient(ellipse 21% 43% at 52% 40%,rgba(244,55,181,.23),transparent 85%),radial-gradient(ellipse 20% 34% at 73% 44%,rgba(57,142,255,.21),transparent 85%);mix-blend-mode:screen;animation:reflections 11s ease-in-out infinite alternate}.warmth{background:radial-gradient(ellipse 28% 45% at 9% 70%,rgba(255,155,62,.17),transparent 85%),radial-gradient(ellipse 17% 28% at 81% 77%,rgba(255,167,87,.14),transparent 85%);mix-blend-mode:screen;animation:warmth 7s ease-in-out infinite alternate}.lightning{opacity:0;background:radial-gradient(ellipse 68% 57% at 64% 20%,rgba(209,221,255,.54),rgba(158,185,255,.13) 57%,transparent 85%);mix-blend-mode:screen;transition:opacity 420ms ease-out}.vignette{background:linear-gradient(to bottom,rgba(0,0,0,.12),transparent 24%,transparent 73%,rgba(0,0,0,.18))}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.clock{position:absolute;top:4.5%;right:4.5%;text-align:right;text-shadow:0 2px 18px rgba(0,0,0,.9);font-weight:300;letter-spacing:.045em;opacity:.83;transition:opacity .3s}.time{font-size:clamp(26px,3.3vw,65px)}.date{font-size:clamp(11px,1.1vw,19px);margin-top:4px;letter-spacing:.12em}.controls{position:absolute;left:3%;bottom:4%;display:flex;gap:9px;opacity:0;transition:opacity .4s}.controls.show,.controls:focus-within{opacity:1}.controls button{background:rgba(10,13,28,.72);border:1px solid rgba(255,255,255,.35);border-radius:7px;color:white;padding:10px 14px;font-size:14px;cursor:pointer}.hint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);font-size:13px;opacity:0;pointer-events:none;transition:opacity .6s}.hint.show{opacity:.75}@keyframes mist{from{transform:translateX(-4%);opacity:.35}to{transform:translateX(5%);opacity:.85}}@keyframes reflections{from{opacity:.28;transform:translateX(-1%)}to{opacity:.8;transform:translateX(1%)}}@keyframes warmth{from{opacity:.4}to{opacity:.85}}@media(prefers-reduced-motion:reduce){.mist,.reflections,.warmth{animation:none}}

.weather{display:flex;align-items:center;justify-content:flex-end;gap:11px;margin-top:13px;text-shadow:0 2px 12px rgba(0,0,0,.9);font-weight:400;letter-spacing:.01em}.weather-icon{font-size:clamp(24px,2.1vw,38px);line-height:1}.weather-reading{text-align:right}.weather-temp{font-size:clamp(18px,1.8vw,31px);line-height:1.1}.weather-label{font-size:clamp(10px,.82vw,14px);margin-top:5px;color:rgba(255,255,255,.87)}.weather-credit{font-size:clamp(8px,.62vw,10px);margin-top:6px;color:rgba(255,255,255,.65)}@media(max-width:700px){.weather{margin-top:8px;gap:7px}.clock{right:5%;top:4%}}
</style></head><body>
<div class="scene"><div class="backdrop"></div><div class="layer mist"></div><div class="layer reflections"></div><div class="layer warmth"></div><div class="layer lightning" id="lightning"></div><canvas id="effects"></canvas><div class="layer vignette"></div></div>
<div class="clock" id="clock"><div class="time" id="time"></div><div class="date" id="date"></div><div class="weather" id="weather" aria-live="polite"><div class="weather-icon" id="weatherIcon">☁</div><div class="weather-reading"><div class="weather-temp" id="weatherTemp">—°C</div><div class="weather-label" id="weatherLabel">Nancy · Chargement…</div><div class="weather-credit">Données : Open-Meteo</div></div></div></div><div class="controls" id="controls"><button id="toggleClock">Masquer l'heure</button><button id="toggleEffects">Pause animation</button><button id="toggleLightning">Éclairs : oui</button></div><div class="hint" id="hint">OK : options · Flèches : afficher / masquer l'heure</div>
<script>
(function(){'use strict';
var canvas=document.getElementById('effects'),ctx=canvas.getContext('2d'),W=0,H=0,scale=1,drops=[],streaks=[],outsideRain=[],steam=[],cars=[],paused=false,clockVisible=true,last=0,hideTimer=0,frame=0,lightningNext=0,lightningUntil=0,lightningEnabled=true;
var mist=document.querySelector('.mist'),reflections=document.querySelector('.reflections'),warmth=document.querySelector('.warmth');
function rnd(a,b){return a+Math.random()*(b-a)}
function resize(){W=window.innerWidth;H=window.innerHeight;scale=Math.min(1,1100/Math.max(W,H));canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0);drops=[];streaks=[];outsideRain=[];steam=[];cars=[];
var n=Math.min(145,Math.max(58,Math.round(W/15)));for(var i=0;i<n;i++)drops.push({x:rnd(W*.05,W*.95),y:rnd(-H,H*.62),r:rnd(1.3,4.1)*W/1600,v:rnd(.26,.94),tail:rnd(18,58),alpha:rnd(.22,.49)});
for(i=0;i<Math.min(190,Math.round(W/9));i++)streaks.push({x:rnd(0,W),y:rnd(-H,H*.7),len:rnd(6,18)*H/900,v:rnd(2.5,5.2)*H/900,a:rnd(.075,.21)});
// Rain beyond the windows: limited to the three exterior glass panes.
// This is intentionally separate from the close-up glass droplets.
var panes=[[.084,.438,.025,.685],[.461,.738,.02,.665],[.758,.902,.035,.64]];
for(i=0;i<125;i++){
 var pane=panes[Math.floor(Math.random()*panes.length)];
 outsideRain.push({pane:pane,x:rnd(pane[0],pane[1])*W,y:rnd(pane[2],pane[3])*H,
  speed:rnd(3.3,7.0)*H/900,length:rnd(8,23)*H/900,alpha:rnd(.13,.34),wind:rnd(-1.8,-.45)*W/1600});
}
// Small vehicles on the distant avenue: depth-scaled lights only, no sprites crossing buildings.
for(i=0;i<12;i++)cars.push({progress:rnd(0,1),lane:i%2,rate:rnd(.000028,.000056),phase:rnd(0,6.283),size:rnd(.8,1.25)});
for(i=0;i<19;i++)steam.push({phase:rnd(0,6.28),life:rnd(0,1),size:rnd(9,19),offset:rnd(-13,13)});
}
function draw(t){requestAnimationFrame(draw);if(paused){last=t;return}var dt=Math.min(2,(t-last)/16.67||1);last=t;frame++;ctx.clearRect(0,0,W,H);if(lightningEnabled){if(!lightningNext)lightningNext=t+rnd(28000,52000);if(t>=lightningNext){lightningUntil=t+650;lightningNext=t+rnd(32000,67000)}var pulse=0;if(t<lightningUntil){var progress=(lightningUntil-t)/650;pulse=.24*Math.pow(progress,1.6)}document.getElementById("lightning").style.opacity=String(pulse)}ctx.save();ctx.beginPath();ctx.rect(0,0,W,H*.76);ctx.clip();
// Additional falling rain OUTSIDE the apartment, clipped to window glass only.
// The vertical and horizontal bars, sofa and tea table remain unobstructed.
ctx.save();
for(var pi=0;pi<3;pi++){
 var pp=[[.084,.438,.025,.685],[.461,.738,.02,.665],[.758,.902,.035,.64]][pi];
 ctx.save();ctx.beginPath();ctx.rect(pp[0]*W,pp[2]*H,(pp[1]-pp[0])*W,(pp[3]-pp[2])*H);ctx.clip();
 for(var ri=0;ri<outsideRain.length;ri++){
  var r=outsideRain[ri];if(r.pane[0]!==pp[0])continue;
  ctx.strokeStyle='rgba(195,219,255,'+r.alpha+')';ctx.lineWidth=.65;
  ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+r.wind*2.2,r.y+r.length);ctx.stroke();
  r.y+=r.speed*dt;r.x+=r.wind*dt;
  if(r.y>pp[3]*H||r.x<pp[0]*W){r.y=pp[2]*H-r.length;r.x=rnd(pp[0],pp[1])*W}
 }
 ctx.restore();
}
ctx.restore();
// Distant traffic, strictly within the visible wet avenue below Tokyo Tower.
// Cars are tiny paired headlights/taillights; their speed and separation follow perspective.
ctx.save();
// Road center line bends slightly toward the foreground. Mask to the avenue only.
ctx.beginPath();ctx.moveTo(W*.632,H*.451);ctx.lineTo(W*.656,H*.451);ctx.lineTo(W*.708,H*.685);ctx.lineTo(W*.624,H*.685);ctx.closePath();ctx.clip();
for(var ci=0;ci<cars.length;ci++){
 var car=cars[ci];
 // Opposing lanes: one approaches the window, the other recedes toward the skyline.
 car.progress+=(car.lane===0?1:-1)*car.rate*dt*16.67;
 if(car.progress>1.05)car.progress=-.05;
 if(car.progress<-.05)car.progress=1.05;
 var z=Math.max(.02,Math.min(1,car.progress));
 var depth=Math.pow(z,1.55);
 var roadX=(.643+.014*depth)*W, roadY=(.46+.22*depth)*H;
 var lateral=(car.lane===0?-.011:.012)*W*(.18+.82*depth);
 var x=roadX+lateral+Math.sin(car.phase+z*2)*W*.0008;
 var y=roadY;
 var size=(.35+2.1*depth)*car.size*Math.min(W/1600,H/900);
 var sep=size*1.75;
 var lightColor=car.lane===0?'255,237,202':'255,65,71';
 var halo=ctx.createRadialGradient(x,y,0,x,y,size*6);
 halo.addColorStop(0,'rgba('+lightColor+',.30)');halo.addColorStop(.35,'rgba('+lightColor+',.12)');halo.addColorStop(1,'rgba('+lightColor+',0)');
 ctx.fillStyle=halo;ctx.beginPath();ctx.arc(x,y,size*6,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(12,15,29,.65)';ctx.fillRect(x-sep*.85,y-size*.45,sep*1.7,size*1.5);
 ctx.fillStyle='rgba('+lightColor+',.94)';
 ctx.beginPath();ctx.arc(x-sep*.5,y,size*.58,0,Math.PI*2);ctx.arc(x+sep*.5,y,size*.58,0,Math.PI*2);ctx.fill();
 // Soft reflection extending down the rain-soaked asphalt.
 var reflection=ctx.createLinearGradient(x,y+size,x,y+size*(4+depth*6));
 reflection.addColorStop(0,'rgba('+lightColor+',.29)');reflection.addColorStop(1,'rgba('+lightColor+',0)');
 ctx.fillStyle=reflection;ctx.fillRect(x-size*1.7,y+size,size*3.4,size*(3+depth*5));
}
ctx.restore();
// Fine distant rain, behind the foreground droplets.
ctx.lineCap='round';for(var i=0;i<streaks.length;i++){var s=streaks[i];ctx.strokeStyle='rgba(191,214,255,'+s.a+')';ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-1.1,s.y+s.len);ctx.stroke();s.y+=s.v*dt;if(s.y>H*.77){s.y=-s.len;s.x=rnd(0,W)}}
// Foreground window droplets stop at the window sill, above the interior.
ctx.save();ctx.beginPath();ctx.rect(0,0,W,H*.665);ctx.clip();
// Sparse drops sliding down the glass, with soft highlights and translucent tails.
for(i=0;i<drops.length;i++){var d=drops[i];var speed=d.v*(.6+Math.sin(t/3500+i)*.15);d.y+=Math.max(.06,speed)*dt*H/900;d.x+=Math.sin(t/2100+i)*.025*dt;var tail=d.tail*H/900;ctx.strokeStyle='rgba(194,215,255,'+(d.alpha*.5)+')';ctx.lineWidth=Math.max(.55,d.r*.65);ctx.beginPath();ctx.moveTo(d.x,d.y-tail);ctx.quadraticCurveTo(d.x+1,d.y-tail*.4,d.x,d.y);ctx.stroke();ctx.fillStyle='rgba(223,237,255,'+d.alpha+')';ctx.beginPath();ctx.ellipse(d.x,d.y,Math.max(.7,d.r*.6),Math.max(1,d.r*1.25),0,0,6.283);ctx.fill();if(d.y>H*.665){d.y=rnd(-H*.4,-10);d.x=rnd(W*.05,W*.95)}}ctx.restore();ctx.restore();
// Existing tea steam preserved, kept gentle (cup position approximate).
var cx=W*.653,cy=H*.747;ctx.save();ctx.globalCompositeOperation='screen';for(i=0;i<steam.length;i++){var q=steam[i];q.life+=.0033*dt;if(q.life>1){q.life=0;q.offset=rnd(-13,13)}var yy=cy-q.life*H*.14,xx=cx+q.offset+Math.sin(q.life*9+t/1900+q.phase)*W*.007;var radius=q.size*(.7+q.life)*W/1600;var g=ctx.createRadialGradient(xx,yy,0,xx,yy,radius*2.6);g.addColorStop(0,'rgba(237,231,255,'+(Math.sin(q.life*Math.PI)*.39)+')');g.addColorStop(1,'rgba(237,231,255,0)');ctx.fillStyle=g;ctx.fillRect(xx-radius*3,yy-radius*3,radius*6,radius*6)}ctx.restore();}
function updateClock(){var now=new Date();document.getElementById('time').textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
// Nancy (Grand Est), weather refreshed every 20 minutes. No API key required.
function weatherDescription(code,day){
 if(code===0)return [day?'☀':'☾','Ciel dégagé'];
 if(code===1)return [day?'🌤':'☁','Peu nuageux'];
 if(code===2)return ['⛅','Partiellement nuageux'];
 if(code===3)return ['☁','Couvert'];
 if(code===45||code===48)return ['≋','Brouillard'];
 if(code===51||code===53||code===55||code===56||code===57)return ['☂','Bruine'];
 if(code===61||code===63||code===65||code===66||code===67)return ['☂','Pluie'];
 if(code===71||code===73||code===75||code===77)return ['❄','Neige'];
 if(code===80||code===81||code===82)return ['☂','Averses'];
 if(code===85||code===86)return ['❄','Averses de neige'];
 if(code===95||code===96||code===99)return ['⚡','Orage'];
 return ['☁','Conditions variables'];
}
function updateWeather(){
 var url='https://api.open-meteo.com/v1/forecast?latitude=48.6921&longitude=6.1844&current=temperature_2m,weather_code,is_day&timezone=Europe%2FParis';
 var req=new XMLHttpRequest();req.open('GET',url,true);req.timeout=12000;
 req.onreadystatechange=function(){if(req.readyState!==4)return;
  if(req.status>=200&&req.status<300){try{var data=JSON.parse(req.responseText),c=data.current;if(!c||typeof c.temperature_2m!=='number')throw Error('missing');var v=weatherDescription(c.weather_code,!!c.is_day);document.getElementById('weatherIcon').textContent=v[0];document.getElementById('weatherTemp').textContent=Math.round(c.temperature_2m)+'°C';document.getElementById('weatherLabel').textContent='Nancy · '+v[1];return}catch(e){}}
  weatherUnavailable();};
 req.onerror=weatherUnavailable;req.ontimeout=weatherUnavailable;
 try{req.send()}catch(e){weatherUnavailable()}
}
function weatherUnavailable(){document.getElementById('weatherIcon').textContent='☁';document.getElementById('weatherTemp').textContent='—°C';document.getElementById('weatherLabel').textContent='Nancy · Météo indisponible'}
function toggleClock(){clockVisible=!clockVisible;document.getElementById('clock').style.opacity=clockVisible?'.83':'0';document.getElementById('toggleClock').textContent=clockVisible?'Masquer l’heure':'Afficher l’heure'}
function toggleEffects(){paused=!paused;if(paused)document.getElementById("lightning").style.opacity="0";document.getElementById('toggleEffects').textContent=paused?'Reprendre animation':'Pause animation';[mist,reflections,warmth].forEach(function(el){el.style.animationPlayState=paused?'paused':'running'})}
document.getElementById("toggleLightning").onclick=function(){lightningEnabled=!lightningEnabled;document.getElementById("lightning").style.opacity="0";document.getElementById("toggleLightning").textContent=lightningEnabled?"Éclairs : oui":"Éclairs : non";showControls()};function showControls(){document.getElementById('controls').classList.add('show');document.getElementById('hint').classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(function(){document.getElementById('controls').classList.remove('show');document.getElementById('hint').classList.remove('show')},5500)}
document.getElementById('toggleClock').onclick=function(){toggleClock();showControls()};document.getElementById('toggleEffects').onclick=function(){toggleEffects();showControls()};document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){toggleClock();e.preventDefault()}else if(e.key==='Enter'||e.key===' '){showControls()}});document.addEventListener('click',showControls);window.addEventListener('resize',resize);resize();updateClock();setInterval(updateClock,15000);updateWeather();setInterval(updateWeather,1200000);requestAnimationFrame(draw);
})();
</script></body></html>
