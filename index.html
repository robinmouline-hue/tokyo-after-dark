<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c1b"><title>Tokyo After Dark 3.0 — Rainy Window</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c1b;color:#fff;font-family:Arial,sans-serif}.scene{position:fixed;inset:0;overflow:hidden}.backdrop{position:absolute;inset:0;background:url('tokyo-cinematic.jpg') center/cover no-repeat;transform:scale(1.012)}.layer{position:absolute;inset:0;pointer-events:none}.mist{background:radial-gradient(ellipse 32% 20% at 57% 47%,rgba(180,195,236,.11),transparent 75%),radial-gradient(ellipse 29% 16% at 80% 38%,rgba(192,178,222,.075),transparent 75%);filter:blur(17px);animation:mist 46s ease-in-out infinite alternate}.reflections{background:radial-gradient(ellipse 21% 43% at 52% 40%,rgba(244,55,181,.075),transparent 85%),radial-gradient(ellipse 20% 34% at 73% 44%,rgba(57,142,255,.065),transparent 85%);mix-blend-mode:screen;animation:reflections 16s ease-in-out infinite alternate}.warmth{background:radial-gradient(ellipse 28% 45% at 9% 70%,rgba(255,155,62,.065),transparent 85%),radial-gradient(ellipse 17% 28% at 81% 77%,rgba(255,167,87,.052),transparent 85%);mix-blend-mode:screen;animation:warmth 9s ease-in-out infinite alternate}.vignette{background:linear-gradient(to bottom,rgba(0,0,0,.12),transparent 24%,transparent 73%,rgba(0,0,0,.18))}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.clock{position:absolute;top:4.5%;right:4.5%;text-align:right;text-shadow:0 2px 18px rgba(0,0,0,.9);font-weight:300;letter-spacing:.045em;opacity:.83;transition:opacity .3s}.time{font-size:clamp(26px,3.3vw,65px)}.date{font-size:clamp(11px,1.1vw,19px);margin-top:4px;letter-spacing:.12em}.controls{position:absolute;left:3%;bottom:4%;display:flex;gap:9px;opacity:0;transition:opacity .4s}.controls.show,.controls:focus-within{opacity:1}.controls button{background:rgba(10,13,28,.72);border:1px solid rgba(255,255,255,.35);border-radius:7px;color:white;padding:10px 14px;font-size:14px;cursor:pointer}.hint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);font-size:13px;opacity:0;pointer-events:none;transition:opacity .6s}.hint.show{opacity:.75}@keyframes mist{from{transform:translateX(-4%);opacity:.35}to{transform:translateX(5%);opacity:.85}}@keyframes reflections{from{opacity:.28;transform:translateX(-1%)}to{opacity:.8;transform:translateX(1%)}}@keyframes warmth{from{opacity:.4}to{opacity:.85}}@media(prefers-reduced-motion:reduce){.mist,.reflections,.warmth{animation:none}}
</style></head><body>
<div class="scene"><div class="backdrop"></div><div class="layer mist"></div><div class="layer reflections"></div><div class="layer warmth"></div><canvas id="effects"></canvas><div class="layer vignette"></div></div>
<div class="clock" id="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div><div class="controls" id="controls"><button id="toggleClock">Masquer l'heure</button><button id="toggleEffects">Pause animation</button></div><div class="hint" id="hint">OK : options · Flèches : afficher / masquer l'heure</div>
<script>
(function(){'use strict';
var canvas=document.getElementById('effects'),ctx=canvas.getContext('2d'),W=0,H=0,scale=1,drops=[],streaks=[],petals=[],steam=[],paused=false,clockVisible=true,last=0,hideTimer=0,frame=0;
var mist=document.querySelector('.mist'),reflections=document.querySelector('.reflections'),warmth=document.querySelector('.warmth');
function rnd(a,b){return a+Math.random()*(b-a)}
function resize(){W=window.innerWidth;H=window.innerHeight;scale=Math.min(1,1100/Math.max(W,H));canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0);drops=[];streaks=[];petals=[];steam=[];
var n=Math.min(48,Math.max(22,Math.round(W/35)));for(var i=0;i<n;i++)drops.push({x:rnd(W*.05,W*.95),y:rnd(-H,H*.69),r:rnd(.8,2.4)*W/1600,v:rnd(.10,.42),tail:rnd(8,25),alpha:rnd(.09,.24)});
for(i=0;i<Math.min(90,Math.round(W/15));i++)streaks.push({x:rnd(0,W),y:rnd(-H,H*.7),len:rnd(6,18)*H/900,v:rnd(2.5,5.2)*H/900,a:rnd(.035,.11)});
for(i=0;i<16;i++)petals.push({x:rnd(-W*.15,W),y:rnd(-H,H*.73),s:rnd(2,5)*W/1600,phase:rnd(0,6.28),v:rnd(.25,.8),a:rnd(.23,.5)});
for(i=0;i<12;i++)steam.push({phase:rnd(0,6.28),life:rnd(0,1),size:rnd(7,15),offset:rnd(-13,13)});
}
function draw(t){requestAnimationFrame(draw);if(paused){last=t;return}var dt=Math.min(2,(t-last)/16.67||1);last=t;frame++;ctx.clearRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H*.76);ctx.clip();
// Fine distant rain, behind the foreground droplets.
ctx.lineCap='round';for(var i=0;i<streaks.length;i++){var s=streaks[i];ctx.strokeStyle='rgba(191,214,255,'+s.a+')';ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-1.1,s.y+s.len);ctx.stroke();s.y+=s.v*dt;if(s.y>H*.77){s.y=-s.len;s.x=rnd(0,W)}}
// Sparse drops sliding down the glass, with soft highlights and translucent tails.
for(i=0;i<drops.length;i++){var d=drops[i];var speed=d.v*(.6+Math.sin(t/3500+i)*.15);d.y+=Math.max(.06,speed)*dt*H/900;d.x+=Math.sin(t/2100+i)*.025*dt;var tail=d.tail*H/900;ctx.strokeStyle='rgba(194,215,255,'+(d.alpha*.5)+')';ctx.lineWidth=Math.max(.55,d.r*.65);ctx.beginPath();ctx.moveTo(d.x,d.y-tail);ctx.quadraticCurveTo(d.x+1,d.y-tail*.4,d.x,d.y);ctx.stroke();ctx.fillStyle='rgba(223,237,255,'+d.alpha+')';ctx.beginPath();ctx.ellipse(d.x,d.y,Math.max(.7,d.r*.6),Math.max(1,d.r*1.25),0,0,6.283);ctx.fill();if(d.y>H*.75){d.y=rnd(-H*.4,-10);d.x=rnd(W*.05,W*.95)}}ctx.restore();
// Gusts: petals drift mostly outside the glass; gust strength rises and falls.
var gust=.45+.55*Math.pow(.5+.5*Math.sin(t/5300),3);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H*.73);ctx.clip();for(i=0;i<petals.length;i++){var p=petals[i];p.x+=(p.v+gust*.8)*dt*W/1600;p.y+=(p.v*.4+gust*.17)*dt*H/900+Math.sin(t/1100+p.phase)*.1*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(t/1400+p.phase)*1.1);ctx.fillStyle='rgba(255,183,216,'+p.a+')';ctx.beginPath();ctx.ellipse(0,0,p.s*.7,p.s*1.15,.3,0,6.283);ctx.fill();ctx.restore();if(p.x>W+10||p.y>H*.74){p.x=rnd(-W*.35,-10);p.y=rnd(-H*.15,H*.63)}}ctx.restore();
// Existing tea steam preserved, kept gentle (cup position approximate).
var cx=W*.653,cy=H*.747;ctx.save();ctx.globalCompositeOperation='screen';for(i=0;i<steam.length;i++){var q=steam[i];q.life+=.0026*dt;if(q.life>1){q.life=0;q.offset=rnd(-13,13)}var yy=cy-q.life*H*.14,xx=cx+q.offset+Math.sin(q.life*9+t/1900+q.phase)*W*.007;var radius=q.size*(.7+q.life)*W/1600;var g=ctx.createRadialGradient(xx,yy,0,xx,yy,radius*2.6);g.addColorStop(0,'rgba(237,231,255,'+(Math.sin(q.life*Math.PI)*.19)+')');g.addColorStop(1,'rgba(237,231,255,0)');ctx.fillStyle=g;ctx.fillRect(xx-radius*3,yy-radius*3,radius*6,radius*6)}ctx.restore();}
function updateClock(){var now=new Date();document.getElementById('time').textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function toggleClock(){clockVisible=!clockVisible;document.getElementById('clock').style.opacity=clockVisible?'.83':'0';document.getElementById('toggleClock').textContent=clockVisible?'Masquer l’heure':'Afficher l’heure'}
function toggleEffects(){paused=!paused;document.getElementById('toggleEffects').textContent=paused?'Reprendre animation':'Pause animation';[mist,reflections,warmth].forEach(function(el){el.style.animationPlayState=paused?'paused':'running'})}
function showControls(){document.getElementById('controls').classList.add('show');document.getElementById('hint').classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(function(){document.getElementById('controls').classList.remove('show');document.getElementById('hint').classList.remove('show')},5500)}
document.getElementById('toggleClock').onclick=function(){toggleClock();showControls()};document.getElementById('toggleEffects').onclick=function(){toggleEffects();showControls()};document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){toggleClock();e.preventDefault()}else if(e.key==='Enter'||e.key===' '){showControls()}});document.addEventListener('click',showControls);window.addEventListener('resize',resize);resize();updateClock();setInterval(updateClock,15000);requestAnimationFrame(draw);
})();
</script></body></html>
