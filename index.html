<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Tokyo After Dark — Rainy Window</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070816;color:#fff;font-family:Arial,sans-serif}body{position:relative}.scene{position:absolute;inset:0;overflow:hidden}.backdrop{position:absolute;inset:-1%;background:url('tokyo-cinematic.jpg') center center/cover no-repeat;animation:breathe 36s ease-in-out infinite alternate;will-change:transform}.rain,.petals,.steam{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.rain{opacity:.73}.steam{opacity:.65}.petals{opacity:.85}.shimmer{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 68% 48%,rgba(229,66,193,.055),transparent 35%),radial-gradient(ellipse at 53% 34%,rgba(59,124,255,.06),transparent 40%);animation:glow 11s ease-in-out infinite alternate}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.1),transparent 24%,transparent 76%,rgba(0,0,0,.16))}.clock{position:absolute;top:4.5%;right:4.5%;text-align:right;text-shadow:0 2px 18px rgba(0,0,0,.9);font-weight:300;letter-spacing:.045em;opacity:.83;transition:opacity .3s}.time{font-size:clamp(26px,3.3vw,65px)}.date{font-size:clamp(11px,1.1vw,19px);margin-top:4px;letter-spacing:.12em}.hint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);font-size:13px;opacity:0;pointer-events:none;transition:opacity .6s}.hint.show{opacity:.75}.controls{position:absolute;left:3%;bottom:4%;display:flex;gap:9px;opacity:0;transition:opacity .4s}.controls.show,.controls:focus-within{opacity:1}.controls button{background:rgba(10,13,28,.65);border:1px solid rgba(255,255,255,.35);border-radius:7px;color:white;padding:10px 14px;font-size:14px;cursor:pointer}@keyframes breathe{from{transform:scale(1.01)}to{transform:scale(1.055) translate(-.3%,-.3%)}}@keyframes glow{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){.backdrop,.shimmer{animation:none}}
</style></head><body><div class="scene"><div class="backdrop"></div><div class="shimmer"></div><canvas id="rain" class="rain"></canvas><canvas id="petals" class="petals"></canvas><canvas id="steam" class="steam"></canvas><div class="vignette"></div></div><div class="clock" id="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div><div class="controls" id="controls"><button id="toggleClock">Masquer l'heure</button><button id="toggleEffects">Pause animation</button></div><div class="hint" id="hint">OK : options · Flèches : masquer / afficher l'heure</div>
<script>
(function(){'use strict';
var rain=document.getElementById('rain'),petals=document.getElementById('petals'),steam=document.getElementById('steam');var rc=rain.getContext('2d'),pc=petals.getContext('2d'),sc=steam.getContext('2d');var W=0,H=0,streaks=[],flowers=[],wisps=[],paused=false,clockVisible=true,controlsVisible=false,hideTimer=0,frames=0,last=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function resize(){W=window.innerWidth;H=window.innerHeight;[rain,petals,steam].forEach(function(c){c.width=W;c.height=H});streaks=[];flowers=[];wisps=[];var n=Math.min(220,Math.max(75,Math.floor(W*H/11000)));for(var i=0;i<n;i++)streaks.push({x:rnd(0,W),y:rnd(0,H),l:rnd(8,26)*H/900,v:rnd(4,10)*H/900,a:rnd(.08,.3),w:rnd(.5,1.4)});for(i=0;i<22;i++)flowers.push({x:rnd(0,W),y:rnd(-H,H),size:rnd(2.5,6)*W/1600,v:rnd(.25,.85),drift:rnd(.35,1.2),phase:rnd(0,6.28)});for(i=0;i<12;i++)wisps.push({x:rnd(-25,25),y:rnd(-30,15),life:rnd(0,1),radius:rnd(8,20),drift:rnd(-.4,.4)})}
function draw(t){if(paused){last=t;requestAnimationFrame(draw);return}var dt=Math.min(2.5,(t-last)/16.67||1);last=t;frames++;rc.clearRect(0,0,W,H);pc.clearRect(0,0,W,H);sc.clearRect(0,0,W,H);
// Rain only across the glass above the wooden window sill; subtle in front of city lights.
rc.save();rc.beginPath();rc.rect(0,0,W,H*.76);rc.clip();rc.lineCap='round';for(var i=0;i<streaks.length;i++){var d=streaks[i];rc.strokeStyle='rgba(193,211,255,'+d.a+')';rc.lineWidth=d.w;rc.beginPath();rc.moveTo(d.x,d.y);rc.lineTo(d.x-2,d.y+d.l);rc.stroke();d.y+=d.v*dt;d.x-=.4*dt;if(d.y>H*.78){d.y=-d.l;d.x=rnd(0,W)}}rc.restore();
// Occasional sakura petals outside the window.
for(i=0;i<flowers.length;i++){var p=flowers[i];p.y+=p.v*dt*H/900;p.x+=p.drift*dt*W/1600+Math.sin(t/850+p.phase)*.16*dt; if(p.y>H*.73||p.x>W){p.y=-10;p.x=rnd(-W*.12,W*.9)}pc.save();pc.translate(p.x,p.y);pc.rotate(Math.sin(t/1300+p.phase)*.8);pc.fillStyle='rgba(255,166,206,.58)';pc.beginPath();pc.ellipse(0,0,p.size*.7,p.size*1.3,.5,0,Math.PI*2);pc.fill();pc.restore()}
// Steam over the cup: its approximate position in the new panorama is x=66%, y=79%.
var cx=W*.663,cy=H*.783;sc.save();sc.globalCompositeOperation='screen';for(i=0;i<wisps.length;i++){var s=wisps[i];s.life+=.0035*dt;if(s.life>1){s.life=0;s.x=rnd(-13,13);s.y=rnd(-5,6)}var yy=cy-s.life*H*.16+s.y;var xx=cx+s.x+Math.sin(s.life*10+t/1900+i)*W*.008+s.drift*s.life*25;var radius=s.radius*(.6+s.life*1.3)*W/1600;var g=sc.createRadialGradient(xx,yy,0,xx,yy,radius*2.7);g.addColorStop(0,'rgba(235,226,255,'+(Math.sin(s.life*Math.PI)*.045)+')');g.addColorStop(1,'rgba(235,226,255,0)');sc.fillStyle=g;sc.fillRect(xx-radius*3,yy-radius*3,radius*6,radius*6)}sc.restore();requestAnimationFrame(draw)}
function updateClock(){var now=new Date();document.getElementById('time').textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}function toggleClock(){clockVisible=!clockVisible;document.getElementById('clock').style.opacity=clockVisible?'.83':'0';document.getElementById('toggleClock').textContent=clockVisible?'Masquer l’heure':'Afficher l’heure'}function toggleEffects(){paused=!paused;document.getElementById('toggleEffects').textContent=paused?'Reprendre animation':'Pause animation'}function showControls(){controlsVisible=true;document.getElementById('controls').classList.add('show');document.getElementById('hint').classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(function(){controlsVisible=false;document.getElementById('controls').classList.remove('show');document.getElementById('hint').classList.remove('show')},6000)}document.getElementById('toggleClock').onclick=function(){toggleClock();showControls()};document.getElementById('toggleEffects').onclick=function(){toggleEffects();showControls()};document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){toggleClock();e.preventDefault()}else if(e.key==='Enter'||e.key===' '){showControls()}});document.addEventListener('click',showControls);window.addEventListener('resize',resize);resize();updateClock();setInterval(updateClock,15000);requestAnimationFrame(draw);
})();
</script></body></html>
