<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080b1a"><title>Tokyo sous la pluie — Ambiance TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b18;color:#fff;font-family:Arial,Helvetica,sans-serif}body{position:relative}
.scene,.photo,.shade,.glow,.mist,.rain,.vignette{position:absolute;inset:0;pointer-events:none}.scene{overflow:hidden}.photo{background-image:url('tokyo-night.jpg');background-size:cover;background-position:center;transform:scale(1.065);animation:drift 55s ease-in-out infinite alternate;filter:saturate(1.06) brightness(.76)}
.shade{background:linear-gradient(90deg,rgba(4,7,21,.43),transparent 45%,rgba(4,7,21,.22)),linear-gradient(0deg,rgba(4,7,21,.4),transparent 35%)}
.glow{opacity:.45;mix-blend-mode:screen;background:radial-gradient(ellipse at 72% 60%,rgba(246,43,138,.16),transparent 42%),radial-gradient(ellipse at 35% 45%,rgba(32,129,255,.19),transparent 50%);animation:pulse 9s ease-in-out infinite alternate}
.mist{inset:auto -20% -25% -20%;height:65%;background:radial-gradient(ellipse at center,rgba(110,141,204,.12),transparent 65%);filter:blur(30px);animation:fog 28s ease-in-out infinite alternate}
.rain{opacity:.65;background-repeat:repeat;transform:translate3d(0,-100%,0);will-change:transform}
.rain.back{background-image:repeating-linear-gradient(106deg,transparent 0,transparent 49px,rgba(179,206,255,.20) 50px,transparent 51px,transparent 91px);background-size:220px 250px;animation:fall 1.45s linear infinite;opacity:.28;filter:blur(.6px)}
.rain.mid{background-image:repeating-linear-gradient(104deg,transparent 0,transparent 80px,rgba(194,218,255,.45) 81px,transparent 82px,transparent 137px);background-size:310px 330px;animation:fall 1.05s linear infinite;opacity:.35}
.rain.front{background-image:repeating-linear-gradient(104deg,transparent 0,transparent 134px,rgba(222,235,255,.62) 135px,transparent 136px,transparent 229px);background-size:460px 400px;animation:fall .72s linear infinite;opacity:.24}
.vignette{box-shadow:inset 0 0 180px 75px rgba(0,0,0,.48)}
.brand{position:absolute;top:6%;left:5.5%;font-size:clamp(10px,1.05vw,18px);letter-spacing:.35em;font-weight:600;color:rgba(255,244,218,.86);text-shadow:0 2px 12px #000}
.clock{position:absolute;right:5.5%;top:5.5%;text-align:right;text-shadow:0 3px 25px #000}.time{font-weight:200;font-size:clamp(42px,5vw,100px);letter-spacing:-.065em}.date{margin-top:4px;font-size:clamp(12px,1.1vw,21px);color:rgba(255,255,255,.8)}
.caption{position:absolute;bottom:6%;left:5.5%;font-size:clamp(10px,1vw,18px);letter-spacing:.22em;color:rgba(255,255,255,.76);text-shadow:0 2px 10px #000}
.controls{position:absolute;bottom:5%;right:5%;display:flex;gap:10px;opacity:0;transition:opacity .3s}.controls:focus-within,.controls:hover{opacity:1}button{background:rgba(7,11,24,.68);border:1px solid rgba(255,255,255,.5);border-radius:9px;color:white;padding:12px 18px;font-size:16px;cursor:pointer}button:focus{outline:3px solid white}
@keyframes drift{from{transform:scale(1.065) translate(-.5%,0)}to{transform:scale(1.1) translate(.5%,-.7%)}}@keyframes pulse{from{opacity:.25}to{opacity:.55}}@keyframes fog{from{transform:translateX(-10%)}to{transform:translateX(10%)}}@keyframes fall{from{transform:translate3d(0,-100%,0)}to{transform:translate3d(-65px,100%,0)}}
@media(prefers-reduced-motion:reduce){.photo,.glow,.mist,.rain{animation:none}.rain{opacity:.1;transform:none}}
</style>
</head>
<body>
<main class="scene" aria-label="Tokyo sous la pluie, scène d'ambiance animée">
<div class="photo"></div><div class="shade"></div><div class="glow"></div><div class="mist"></div><div class="rain back"></div><div class="rain mid"></div><div class="rain front"></div><div class="vignette"></div>
<div class="brand">東京 ・ TOKYO AFTER DARK</div><div class="clock" id="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div><div class="caption">東京の雨 ・ UNE NUIT SOUS LA PLUIE</div>
<div class="controls"><button id="toggle">Masquer l'horloge</button></div>
</main>
<script>
(function(){var time=document.getElementById('time'),date=document.getElementById('date'),clock=document.getElementById('clock'),toggle=document.getElementById('toggle');function tick(){var now=new Date();time.textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});date.textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}tick();setInterval(tick,15000);toggle.onclick=function(){var hidden=clock.style.display==='none';clock.style.display=hidden?'':'none';toggle.textContent=hidden?"Masquer l'horloge":"Afficher l'horloge";};document.addEventListener('keydown',function(e){if(e.key==='0'){toggle.click();}if(e.key==='Enter'&&document.activeElement===document.body){var el=document.documentElement;if(el.requestFullscreen){el.requestFullscreen().catch(function(){});}}});})();
</script>
</body></html>
